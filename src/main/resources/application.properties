spring.application.name=homeoffice

server.port = 8077

security.jwt.secret-key=${JWT_SECRET_KEY}
#spring.ai.openai.api-key=${OPENIA_API_KEY}
#spring.ai.openai.audio.speech.options.model=gpt-4o
# a day
security.jwt.expiration=86400000
# 7 days
security.jwt.refresh-token.expiration=604800000

# a day
#security.jwt.expiration=60000
# 7 days
#security.jwt.refresh-token.expiration=90000

cors.allowed-origins=http://localhost:5173,http://localhost:8080,https://focikhome.netlify.app,https://goahead.netlify.app,http://3.76.109.222
cors.public-url=/api/v1/auth/login,/api/v1/auth/refresh,/api/v1/user/register,/api/v1/auth/test,/actuator/health

server.error.include-message=always

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Warsaw
# Realny serwer (mysql.webio.pl, uzywany zarowno na dev jak i prod) to MySQL 5.7.38 - ponizej
# progu 8.0.0 wspieranego przez domyslny MySQLDialect w Hibernate 7. MySQLLegacyDialect
# (z hibernate-community-dialects) poprawnie generuje SQL dla starszych wersji.
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.MySQLLegacyDialect

# Flyway: baza juz zawiera zmiany zaaplikowane recznie przed wlaczeniem Flywaya (ddl-auto=none,
# wiec dotychczasowe tabele/kolumny powstaly poza Flywayem) - baseline-version=0 oznacza caly
# dotychczasowy stan bazy jako juz wykonany. Pierwszy plik migracji zaczynaj od V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Baseline - stan bazy sprzed wlaczenia Flywaya

#spring.jpa.properties.hibernate.format_sql=true

#local directory to temporarily save files
homeoffice.directory.local=/app/homeoffice

#cards.directory=/
homeoffice.url=${HOME_URL:https://focik-home.s3.eu-central-1.amazonaws.com}
#cards.url=https://focikhome.synology.me/covers/cards

logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
logging.file.name=/logs/homeoffice.log
logging.file.path=/logs

debug=${DEBUG:false}

scheduler.cron=0 0 8 * * FRI

#aws
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:eu-central-1}
aws.bucket-name=${BUCKET_NAME:focik-home}
aws.s3-presigned-url-expiry-minutes=10
aws.textract-confidence-threshold=80.0


# Maksymalny rozmiar pojedynczego pliku
spring.servlet.multipart.max-file-size=10MB
# Maksymalny rozmiar ca?ego ??dania
spring.servlet.multipart.max-request-size=15MB

#ksef
#ksef.config.base-uri=https://api-test.ksef.mf.gov.pl
ksef.config.base-uri=https://api.ksef.mf.gov.pl
#ksef.config.qr-uri=https://qr-test.ksef.mf.gov.pl
ksef.config.qr-uri=https://qr.ksef.mf.gov.pl
ksef.config.suffix-uri=v2
ksef.config.request-timeout=100
ksef.config.token=${KSEF_TOKEN}


#check NIP
gov.mf.api.url=https://wl-api.mf.gov.pl/api/search/nip/

# Claude AI for invoice analysis
spring.ai.anthropic.api-key=${CLAUDE_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5
spring.ai.anthropic.chat.options.max-tokens=4096
claude.model=claude-haiku-4-5
claude.max-tokens=4096
# ID firmy uzywane jako domyslne dopasowanie, gdy transakcja nie pasuje do zadnej firmy (np. 38 = "Inne")
claude.matcher.default-firm-id=${CLAUDE_DEFAULT_FIRM_ID:38}

# Email Configuration (SMTP - Gmail example)
spring.mail.host=smtp.webio.pl
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:app@homeoffice.focik.net}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Email Settings
app.mail.from=noreply@homeoffice.focik.net
app.mail.from-name=HomeOffice App

# Payment Reminder Scheduler Configuration
# Sends reminders 7, 3, 1 days before deadline and daily after deadline
app.payment-reminder.enabled=${PAYMENT_REMINDER:false}
# CRON expression: 0 0 8 * * * = Every day at 8:00 AM
app.payment-reminder.cron=0 0 9 * * *

# Bank Transaction Report Scheduler Configuration
# Sends monthly and weekly bank transaction summaries (payments from account)
app.transaction-report.enabled=${TRANSACTION_REMINDER:false}
# CRON expression: 0 0 10 1 * * = 1st day of month at 10:00 AM
app.transaction-report.monthly.cron=0 0 10 1 * *
# CRON expression: 0 30 9 ? * MON = Every Monday at 9:30 AM
app.transaction-report.weekly.cron=0 30 9 ? * MON

# Internal-only endpoints (n8n webhook ingest, np. propozycje kredytow z e-maili).
# /internal/** i tak nie jest przepuszczane przez nginx z internetu (patrz nginx.conf) -
# ten token to druga, aplikacyjna warstwa ochrony.
internal.api.token=${INTERNAL_API_TOKEN:}

# Purchase Report Scheduler Configuration
# Sends monthly and weekly purchase summaries (credit card purchases)
app.purchase-report.enabled=${PURCHASE_REPORT:false}
# CRON expression: 0 0 10 1 * * = 1st day of month at 10:00 AM
app.purchase-report.monthly.cron=0 0 10 1 * *
# CRON expression: 0 30 9 ? * MON = Every Monday at 9:30 AM
app.purchase-report.weekly.cron=0 30 9 ? * MON